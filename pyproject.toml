[project]
name = "elevenlabs-account-bot"
version = "0.1.0"
description = "Telegram bot that creates ElevenLabs accounts using PinMX-generated mailboxes"
requires-python = ">=3.10"
dependencies = [
    "python-telegram-bot[ext]>=21.0",
    "playwright>=1.49.0",
    "httpx>=0.27.0",
    "supabase>=2.9.0",
    "python-dotenv>=1.0.1",
    "loguru>=0.7.2",
    "kameleo.local-api-client>=4.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
